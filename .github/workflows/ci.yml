name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        mode: [standard, embed, hybrid]
        include:
          - mode: standard
            cmake-flags: ""
          - mode: embed
            cmake-flags: "-DERYX_EMBED=ON"
          - mode: hybrid
            cmake-flags: "-DERYX_HYBRID=ON"

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.mode }} (${{ matrix.os == 'ubuntu-latest' && 'linux' || 'windows' }})

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++-14 \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libwayland-dev libdecor-0-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libdbus-1-dev libibus-1.0-dev libudev-dev

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache FetchContent downloads
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('runtime.cmake', 'CMakeLists.txt', 'modules_native.cmake', 'vendor/*.cmake') }}

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=23 ${{ runner.os == 'Linux' && '-DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_C_COMPILER=gcc-14' || '' }} ${{ matrix.cmake-flags }}

      - name: Build
        run: cmake --build build --parallel

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eryx-${{ matrix.mode }}-${{ matrix.os == 'ubuntu-latest' && 'linux' || 'windows' }}
          path: |
            build/eryx${{ runner.os == 'Windows' && '.exe' || '' }}
            build/EryxShared${{ runner.os == 'Windows' && '.dll' || '.so' }}
            build/modules/
            build/scripts/
          if-no-files-found: ignore

  release-nightly:
    name: Publish nightly release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move nightly tag to this commit
        run: |
          git tag -f nightly "$GITHUB_SHA"
          git push -f origin nightly

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Zip artifacts
        run: |
          cd dist
          for d in */; do
            name="${d%/}"
            zip -r "../${name}.zip" "$name"
          done

      - name: Publish nightly release
        uses: ncipollo/release-action@v1
        with:
          tag: nightly
          name: Nightly
          prerelease: true
          makeLatest: false
          allowUpdates: true
          replacesArtifacts: true
          artifacts: "*.zip"
          body: |
            Automated nightly build from `${{ github.sha }}`.

  deploy-docs:
    name: Deploy docs (Windows / standard)
    runs-on: windows-latest
    needs: build
    if: github.event_name == 'push'
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows standard build artifact
        uses: actions/download-artifact@v4
        with:
          name: eryx-standard-windows
          path: artifact

      - name: Show downloaded files
        run: dir artifact

      - name: Generate documentation
        shell: pwsh
        run: |
          Write-Host "Running eryx pkg install and eryx run doc from repository root using downloaded executable"
          $exe = Join-Path $env:GITHUB_WORKSPACE 'artifact\eryx.exe'
          if (Test-Path $exe) {
            & $exe pkg install
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $exe run doc
          } else {
            Write-Error "eryx executable not found at $exe"
            exit 1
          }

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build-docs

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
